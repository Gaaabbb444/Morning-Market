# Réglages généraux de Morning-Market.

projet:
  nom: "Morning-Market"
  fuseau_horaire: "Europe/Paris"   # toutes les dates affichées sont à l'heure de Paris
  langue: "fr"

# Les 7 catégories, alignées sur les cours.
# « id » est le code court utilisé dans les fichiers JSON ; « libelle » est le texte affiché en entier,
# « libelle_pastille » dans les filtres et les lignes du Top 5, « libelle_onglet » dans les onglets de Catégories.
categories:
  - id: croissance
    libelle: "Croissance, innovation et transition écologique"
    libelle_pastille: "Croissance"
    libelle_onglet: "Croissance"
  - id: mondialisation
    libelle: "Mondialisation et commerce international"
    libelle_pastille: "Mondialisation"
    libelle_onglet: "Mondialisation"
  - id: finance
    libelle: "Finance, marchés et banques centrales"
    libelle_pastille: "Finance"
    libelle_onglet: "Finance"
  - id: desequilibres
    libelle: "Déséquilibres : emploi, inflation, inégalités, dette et déficits"
    libelle_pastille: "Déséquilibres"
    libelle_onglet: "Déséquilibres"
  - id: ue
    libelle: "Union européenne"
    libelle_pastille: "UE"
    libelle_onglet: "Union européenne"
  - id: entreprises
    libelle: "Entreprises et secteurs"
    libelle_pastille: "Entreprises"
    libelle_onglet: "Entreprises"
  - id: epargne
    libelle: "Épargne et patrimoine"
    libelle_pastille: "Épargne"
    libelle_onglet: "Épargne et patrimoine"

# ---------------------------------------------------------------------------
# Collecte des articles
# ---------------------------------------------------------------------------
collecte:
  fenetre_heures: 30          # on garde les articles publiés depuis moins de 30 h
  delai_reseau_secondes: 20   # temps d'attente maximal pour chaque flux
  minimum_articles: 30        # en dessous, la collecte est jugée en échec (données précédentes conservées)
  longueur_min_titre: 15      # les titres plus courts (vides, « Tir groupé »…) ne sont pas informatifs

# Flux testés le 17/10/2026. « type » : presse, institution, international ou agregateur.
# « agregateur » = flux Google News limité à un site : titre seul, pas de chapô.
# « categorie_probable » aide le classement quand l'IA est indisponible.
sources:
  - { id: lemonde-eco,      nom: "Le Monde",              type: presse,        url: "https://www.lemonde.fr/economie/rss_full.xml" }
  - { id: lemonde-argent,   nom: "Le Monde",              type: presse,        url: "https://www.lemonde.fr/argent/rss_full.xml", categorie_probable: epargne }
  - { id: figaro-eco,       nom: "Le Figaro",             type: presse,        url: "https://www.lefigaro.fr/rss/figaro_economie.xml" }
  - { id: figaro-placement, nom: "Le Figaro",             type: presse,        url: "https://www.lefigaro.fr/rss/figaro_placement.xml", categorie_probable: epargne }
  - { id: franceinfo-eco,   nom: "franceinfo",            type: presse,        url: "https://www.francetvinfo.fr/economie.rss" }
  # Les Echos : flux natifs bloqués (erreur 403). « www. » écarte les annonces légales et les fiches Investir.
  - { id: lesechos,         nom: "Les Echos",             type: agregateur,    url: "https://news.google.com/rss/search?q=site:www.lesechos.fr+when:1d&hl=fr&gl=FR&ceid=FR:fr" }
  - { id: latribune,        nom: "La Tribune",            type: presse,        url: "https://www.latribune.fr/feed.xml" }
  # BFM : on écarte les rediffusions d'émissions TV, qui forment la moitié du flux.
  - { id: bfm-business,     nom: "BFM Business",          type: presse,        url: "https://www.bfmtv.com/rss/economie/", exclure_si_lien_contient: ["/replay-emissions/"] }
  - { id: capital,          nom: "Capital",               type: presse,        url: "https://feed.prismamediadigital.com/v1/cap/rss?sources=capital", categorie_probable: epargne }
  - { id: alternatives-eco, nom: "Alternatives Économiques", type: presse,      url: "https://www.alternatives-economiques.fr/rss.xml" }
  - { id: lopinion,         nom: "L'Opinion",             type: presse,        url: "https://www.lopinion.fr/index.rss" }
  - { id: toute-l-europe,   nom: "Toute l'Europe",        type: presse,        url: "https://www.touteleurope.eu/feed/", categorie_probable: ue }
  - { id: bce,              nom: "BCE",                   type: institution,   url: "https://www.ecb.europa.eu/rss/press.html", categorie_probable: finance }
  - { id: insee,            nom: "INSEE",                 type: institution,   url: "https://www.insee.fr/fr/flux/3" }
  - { id: economie-gouv,    nom: "Ministère de l'Économie", type: institution, url: "https://www.economie.gouv.fr/rss/toutesactualites" }
  - { id: bbc-business,     nom: "BBC",                   type: international, url: "https://feeds.bbci.co.uk/news/business/rss.xml" }
  - { id: guardian-business, nom: "The Guardian",         type: international, url: "https://www.theguardian.com/uk/business/rss" }  # édition UK forcée : les serveurs GitHub (USA) sont sinon redirigés vers l'édition US

# ---------------------------------------------------------------------------
# Indicateurs chiffrés (identifiants vérifiés le 17/10/2026)
# fournisseur : bce, eurostat ou marche (Yahoo Finance via yfinance, puis accès direct en secours)
# variation : « pourcent » (évolution en %) ou « points » (écart de points de %)
# Affichage sur le site : nom, note (sous-titre), groupe (bloc de la vue Marchés), unite_affichee après la valeur ;
# nom_court et ordre_bandeau pour les 5 indicateurs du bandeau de l'accueil.
# ---------------------------------------------------------------------------
indicateurs:
  - id: cac40
    libelle: "CAC 40"
    nom: "CAC 40"
    note: "Bourse de Paris"
    groupe: "Marchés"
    unite_affichee: ""
    nom_court: "CAC 40"
    ordre_bandeau: 1
    unite: "pts"
    decimales: 0
    frequence: quotidienne
    variation: pourcent
    fournisseur: marche
    symbole: "^FCHI"
    source: "Euronext (via Yahoo Finance)"
    source_url: "https://fr.finance.yahoo.com/quote/%5EFCHI/"
  - id: eurostoxx50
    libelle: "Euro Stoxx 50"
    nom: "Euro Stoxx 50"
    note: "Grandes valeurs de la zone euro"
    groupe: "Marchés"
    unite_affichee: ""
    unite: "pts"
    decimales: 0
    frequence: quotidienne
    variation: pourcent
    fournisseur: marche
    symbole: "^STOXX50E"
    source: "STOXX (via Yahoo Finance)"
    source_url: "https://fr.finance.yahoo.com/quote/%5ESTOXX50E/"
  - id: sp500
    libelle: "S&P 500"
    nom: "S&P 500"
    note: "Bourse de New York"
    groupe: "Marchés"
    unite_affichee: ""
    unite: "pts"
    decimales: 0
    frequence: quotidienne
    variation: pourcent
    fournisseur: marche
    symbole: "^GSPC"
    source: "S&P (via Yahoo Finance)"
    source_url: "https://fr.finance.yahoo.com/quote/%5EGSPC/"
  - id: brent
    libelle: "Pétrole Brent"
    nom: "Pétrole Brent"
    note: "En dollars par baril"
    groupe: "Marchés"
    unite_affichee: "$"
    nom_court: "Brent"
    ordre_bandeau: 3
    unite: "$/baril"
    decimales: 2
    frequence: quotidienne
    variation: pourcent
    fournisseur: marche
    symbole: "BZ=F"
    source: "ICE (via Yahoo Finance)"
    source_url: "https://fr.finance.yahoo.com/quote/BZ%3DF/"
  - id: or
    libelle: "Or"
    nom: "Or"
    note: "En dollars par once"
    groupe: "Marchés"
    unite_affichee: "$"
    unite: "$/once"
    decimales: 0
    frequence: quotidienne
    variation: pourcent
    fournisseur: marche
    symbole: "GC=F"
    source: "COMEX (via Yahoo Finance)"
    source_url: "https://fr.finance.yahoo.com/quote/GC%3DF/"
  - id: eur-usd
    libelle: "EUR/USD"
    nom: "EUR/USD"
    note: "Dollars pour un euro"
    groupe: "Change"
    unite_affichee: "$"
    nom_court: "EUR/USD"
    ordre_bandeau: 2
    unite: "$"
    decimales: 4
    frequence: quotidienne
    variation: pourcent
    fournisseur: bce
    serie: "EXR/D.USD.EUR.SP00.A"
    source: "BCE (taux de référence)"
    source_url: "https://data.ecb.europa.eu/data/datasets/EXR/EXR.D.USD.EUR.SP00.A"
  - id: taux-depot-bce
    libelle: "Taux de dépôt de la BCE"
    nom: "Taux de dépôt de la BCE"
    note: "Taux directeur"
    groupe: "Taux"
    unite_affichee: "%"
    nom_court: "Taux BCE"
    ordre_bandeau: 4
    unite: "%"
    decimales: 2
    frequence: quotidienne
    variation: points
    fournisseur: bce
    serie: "FM/D.U2.EUR.4F.KR.DFR.LEV"
    source: "BCE"
    source_url: "https://data.ecb.europa.eu/data/datasets/FM/FM.D.U2.EUR.4F.KR.DFR.LEV"
  - id: taux-10-ans-france
    libelle: "Taux à 10 ans de la France"
    nom: "Taux à 10 ans de la France"
    note: "Moyenne mensuelle (OAT)"
    groupe: "Taux"
    unite_affichee: "%"
    unite: "%"
    decimales: 2
    frequence: mensuelle
    variation: points
    fournisseur: bce
    serie: "IRS/M.FR.L.L40.CI.0000.EUR.N.Z"
    source: "BCE (moyenne mensuelle)"
    source_url: "https://data.ecb.europa.eu/data/datasets/IRS/IRS.M.FR.L.L40.CI.0000.EUR.N.Z"
  # Inflation : depuis 2026, la nomenclature des prix a changé (ECOICOP 2) et l'ancienne
  # série de la BCE (ICP…ANR) s'arrête en décembre 2025. On utilise donc Eurostat.
