<!doctype html>
<html lang="fr" class="mm-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Morning Market : l'essentiel de l'actualité économique en cinq minutes, et la mémoire de l'année.">
  <title>Morning Market</title>
  <link rel="preload" href="polices/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // Applique le thème mémorisé avant l'affichage, pour éviter un éclair de la mauvaise couleur.
    try {
      var themeForce = new URLSearchParams(location.search).get("theme");
      var themeMemorise = JSON.parse(localStorage.getItem("morning-market:theme") || "null");
      if ((themeForce || themeMemorise) === "light") document.documentElement.className = "mm-light";
    } catch (e) { /* mémoire du navigateur indisponible : thème sombre par défaut */ }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="coque relative flex w-full h-screen min-h-[640px] overflow-hidden bg-fond text-encre font-sans">
    <div class="fond-anime" aria-hidden="true"></div>

    <aside class="barre-laterale relative z-[1] w-[232px] shrink-0 box-border pt-10 px-5 pb-7 flex flex-col gap-11 bg-cote border-r border-cote-bord">
      <span class="marque px-3.5 text-[20px] font-extrabold tracking-[-0.03em]">Morning Market</span>
      <nav id="navigation" aria-label="Navigation principale" class="relative flex flex-col gap-1">
        <span aria-hidden="true" class="repere-nav absolute inset-x-0 top-0 h-[46px] rounded-nav bg-accent-fond"></span>
      </nav>
      <div class="pied-barre mt-auto flex flex-col gap-1">
        <button type="button" id="bouton-theme" class="lien-nav presse flex items-center gap-3.5 h-[46px] px-3.5 border-0 rounded-nav bg-transparent cursor-pointer text-[15px] font-semibold whitespace-nowrap text-left text-encre2" aria-label="Passer en mode clair">
          <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;flex-shrink:0"><path d=""></path></svg><span data-libelle>Mode clair</span></button>
      </div>
    </aside>

    <div id="zone-principale" class="zone-principale defilement relative z-[1] flex-1 min-w-0 overflow-y-auto box-border pt-10 pr-[72px] pb-[72px] pl-16">
      <div id="contenu" class="max-w-[1180px]" aria-live="polite"></div>
    </div>

    <div id="couche-modale"></div>
    <div id="couche-recherche"></div>
  </div>
  <noscript><p style="padding:24px">Ce site a besoin de JavaScript pour afficher l'édition du jour.</p></noscript>
</body>
</html>
